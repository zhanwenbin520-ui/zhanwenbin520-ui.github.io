name: Import original birthday artwork

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base="https://jingnan-birthday-2026.hanbaobao3366.chatgpt.site"
          files=(
            bg-stage-1-sunset.png
            bg-stage-2-bluehour.png
            bg-stage-3-night.png
            bg-stage-4-aurora.png
            birthday-title.png
            cake-blown.png
            cake-lit.png
            clover-click-1.png
            clover-click-2.png
            clover-click-3.png
            clover-glow.png
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 3 "${base}/${file}" --output "assets/${file}"
          done
          rm -f .github/workflows/import-assets.yml

      - name: Commit restored assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore original birthday artwork"
          git push
