<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171941">
  <meta name="description" content="送给婧男的七片幸运与一场极光">
  <link rel="icon" href="data:,">
  <title>给婧男的七片幸运</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="birthday-scene" id="birthdayScene" data-stage="1">
    <!-- 四张背景常驻叠放，仅改变透明度，避免切换时闪白。 -->
    <div class="backgrounds" aria-hidden="true">
      <div class="stage-background stage-background--sunset"></div>
      <div class="stage-background stage-background--bluehour"></div>
      <div class="stage-background stage-background--night"></div>
      <div class="stage-background stage-background--aurora"></div>
      <div class="night-tint"></div>
      <div class="soft-vignette"></div>
    </div>

    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="shooting-star" id="shootingStar" aria-hidden="true"></div>
    <div class="spark-layer" id="sparkLayer" aria-hidden="true"></div>

    <!-- 收集阶段 -->
    <section class="quest" id="quest" aria-label="收集四叶草">
      <header class="story-copy">
        <p class="eyebrow">FOR JINGNAN · A LITTLE LUCK</p>
        <p class="story-line" id="storyLine" aria-live="polite">
          点击四叶草，收集剩下的小幸运
        </p>
      </header>

      <div class="clover-field" id="cloverField">
        <button class="clover-button" type="button" data-clover="0"
          aria-label="收集第一片四叶草">
          <img src="assets/clover-click-1.png" alt="">
        </button>
        <button class="clover-button" type="button" data-clover="1"
          aria-label="收集第二片四叶草">
          <img src="assets/clover-click-2.png" alt="">
        </button>
        <button class="clover-button" type="button" data-clover="2"
          aria-label="收集第三片四叶草">
          <img src="assets/clover-click-3.png" alt="">
        </button>
      </div>
    </section>

    <!-- 七个固定槽位让“4 → 5 → 6 → 7”的进度始终一眼可见。 -->
    <aside class="collection" id="collection" aria-label="已收集四叶草">
      <div class="collection-label">
        <span>LUCK COLLECTED</span>
        <strong><span id="collectedCount">4</span> / 7</strong>
      </div>
      <div class="collection-slots" id="collectionSlots">
        <span class="clover-slot is-filled"><img src="assets/clover-glow.png" alt=""></span>
        <span class="clover-slot is-filled"><img src="assets/clover-glow.png" alt=""></span>
        <span class="clover-slot is-filled"><img src="assets/clover-glow.png" alt=""></span>
        <span class="clover-slot is-filled"><img src="assets/clover-glow.png" alt=""></span>
        <span class="clover-slot" data-slot="0"><img src="assets/clover-glow.png" alt=""></span>
        <span class="clover-slot" data-slot="1"><img src="assets/clover-glow.png" alt=""></span>
        <span class="clover-slot" data-slot="2"><img src="assets/clover-glow.png" alt=""></span>
      </div>
    </aside>

    <!-- 最终祝福：各元素通过 CSS 延迟依次出现。 -->
    <section class="finale" id="finale" aria-label="生日祝福" hidden>
      <img class="birthday-title reveal-item" src="assets/birthday-title.png"
        alt="Happy Birthday, Jingnan">
      <p class="korean-wish reveal-item" lang="ko">
        모든 행운을 너에게, 모든 오로라를 너와 함께.
      </p>
      <p class="chinese-wish reveal-item">
        为你凑齐七朵小幸运，陪你看尽所有的极光。
      </p>

      <button class="cake-button reveal-item" id="cakeButton" type="button"
        aria-label="点击蛋糕，吹灭蜡烛">
        <span class="cake-halo" aria-hidden="true"></span>
        <img id="cakeImage" src="assets/cake-lit.png" alt="点亮蜡烛的生日蛋糕">
        <span class="smoke" id="smoke" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
        <span class="cake-hint" id="cakeHint">许一个愿望，再轻轻点亮这里</span>
      </button>

      <p class="final-message" id="finalMessage" aria-live="polite">
        <span class="final-message__wish">新的一年 天天开心！ 得偿所愿！！</span>
        <span class="final-message__birthday">婧男同学生日快乐！！！</span>
      </p>
    </section>

    <p class="sr-only" id="statusText" aria-live="assertive"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
